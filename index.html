<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>College Marketplace</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./static/style.css">
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <a href="#" class="btn full-btn">+ Add Item</a>

        <h3>Category</h3>
        <a href="#">All</a>
        <a href="#">Books</a>
        <a href="#">Electronics</a>
        <a href="#">Clothes</a>
        <a href="#">Others</a>

        <h3>Sort by Price</h3>
        <a href="#">Low to High</a>
        <a href="#">High to Low</a>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <div class="container">

            <!-- ITEM 1 -->
            <div class="card">
                <img src="./static/uploads/default.png" class="item-img">
                <h3>Math Book</h3>
                <p>Books</p>
                <p class="price">₹200</p>
                <div class="tag-box">
                    <span class="tag">#book</span>
                    <span class="tag">#study</span>
                    <span class="tag">#education</span>
                </div>
            </div>

            <!-- ITEM 2 -->
            <div class="card">
                <img src="./static/uploads/default.png" class="item-img">
                <h3>Laptop</h3>
                <p>Electronics</p>
                <p class="price">₹40000</p>
                <div class="tag-box">
                    <span class="tag">#electronics</span>
                    <span class="tag">#coding</span>
                </div>
            </div>

            <!-- ITEM 3 -->
            <div class="card">
                <img src="./static/uploads/default.png" class="item-img">
                <h3>Headphones</h3>
                <p>Electronics</p>
                <p class="price">₹1500</p>
                <div class="tag-box">
                    <span class="tag">#audio</span>
                    <span class="tag">#music</span>
                </div>
            </div>

            <!-- ITEM 4 -->
            <div class="card">
                <img src="./static/uploads/default.png" class="item-img">
                <h3>T-Shirt</h3>
                <p>Clothes</p>
                <p class="price">₹500</p>
                <div class="tag-box">
                    <span class="tag">#fashion</span>
                    <span class="tag">#casual</span>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
